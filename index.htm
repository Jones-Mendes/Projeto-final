<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Projeto Final AR</title>
<link rel="stylesheet" href="./styles.css">
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<script>
// ------------------------------------------------------------
// Componente principal da experiência AR
// Responsável por: detectar marcadores, controlar áudio e
// animar o modelo quando os marcadores estão próximos.
// ------------------------------------------------------------
AFRAME.registerComponent('interaction-detector', {
    init: function () {
        this.hiroMarker = document.querySelectorAll('a-marker')[0];
        this.kanjiMarker = document.querySelectorAll('a-marker')[1];
        this.livroEl = document.querySelector('#livro');
        this.audioBtn = document.querySelector('#audioBtn');

        this.audio = new Audio('./explicando.mp3');
        this.audio.loop = false;
        this.lastPressTs = 0;

        this.audio.addEventListener('ended', () => {
            this._syncAudioButtonLabel();
        });

        this._handleAudioButtonPress = (event) => {
            event.preventDefault();
            event.stopPropagation();

            const now = Date.now();
            if (now - this.lastPressTs < 350) {
                return;
            }
            this.lastPressTs = now;

            if (this.audio.paused) {
                this.audio.currentTime = 0;
                this.audio.play().catch(() => {});
            } else {
                this._stopAudio();
            }

            this._syncAudioButtonLabel();
        };

        if (this.audioBtn) {
            this.audioBtn.addEventListener('pointerup', this._handleAudioButtonPress);
            this.audioBtn.addEventListener('click', this._handleAudioButtonPress);
            this.audioBtn.addEventListener('touchend', this._handleAudioButtonPress, { passive: false });
        }

        this._syncAudioButtonLabel();

        this.lastState = 'far';
        this.THRESHOLD = 0.28;
        this.spinX = 0;
        this.spinY = 0;
        this.spinZ = 0;
        this.floatTime = 0;
        this.posHiro = new THREE.Vector3();
        this.posKanji = new THREE.Vector3();

        window.ARTouchState = window.ARTouchState || {
            isInteracting: false,
            target: null
        };
    },

    tick: function (time, deltaTime) {
        const dt = Math.min(deltaTime, 100) / 1000;
        const hiroVisible = this.hiroMarker.object3D.visible;
        const kanjiVisible = this.kanjiMarker.object3D.visible;
        const touchState = window.ARTouchState;
        const livroUnderTouch = !!(touchState && touchState.isInteracting && touchState.target === 'livro');

        if (!kanjiVisible) {
            this._setFarState();
            return;
        }

        if (!hiroVisible) {
            this._setFarState();
            if (!livroUnderTouch) {
                this._doFloat(dt);
            }
            return;
        }

        this.hiroMarker.object3D.getWorldPosition(this.posHiro);
        this.kanjiMarker.object3D.getWorldPosition(this.posKanji);
        const dist = this.posHiro.distanceTo(this.posKanji);

        if (dist < this.THRESHOLD) {
            if (this.lastState !== 'near') {
                this.lastState = 'near';
                const rot = this.livroEl.getAttribute('rotation');
                this.spinX = rot.x;
                this.spinY = rot.y;
                this.spinZ = rot.z;
            }

            if (!livroUnderTouch) {
                this._doSpin(dt);
            }
        } else {
            if (this.lastState === 'near') {
                this._setFarState();
            }

            if (!livroUnderTouch) {
                this._doFloat(dt);
            }
        }
    },

    _syncAudioButtonLabel: function () {
        if (!this.audioBtn) { return; }
        const isPlaying = !this.audio.paused;
        this.audioBtn.textContent = isPlaying ? '⏹️ Parar História' : '🔊 Ouvir História';
        this.audioBtn.setAttribute('aria-label', isPlaying ? 'Parar História' : 'Ouvir História');
    },

    _stopAudio: function () {
        if (!this.audio.paused) {
            this.audio.pause();
        }
        this.audio.currentTime = 0;
        this._syncAudioButtonLabel();
    },

    _setFarState: function () {
        if (this.lastState === 'near') {
            this._stopAudio();
            this.floatTime = 0;
        }
        this.lastState = 'far';
    },

    _doSpin: function (dt) {
        this.spinX += 80 * dt;
        this.spinY += 120 * dt;
        this.spinZ += 60 * dt;

        this.livroEl.setAttribute('rotation', {
            x: this.spinX,
            y: this.spinY,
            z: this.spinZ
        });
    },

    _doFloat: function (dt) {
        this.floatTime += dt;
        const floatY = Math.sin(this.floatTime * 1.8) * 0.12;
        const pos = this.livroEl.getAttribute('position');
        this.livroEl.setAttribute('position', {
            x: pos.x,
            y: floatY,
            z: pos.z
        });
    }
});
</script>
</head>
<body>
<!-- Botão de controle de áudio da apresentação AR -->
<button id="audioBtn" class="audio-btn" type="button" aria-label="Ouvir História">🔊 Ouvir História</button>

<!-- Cena AR principal: marcadores Hiro e Kanji + câmera -->
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;" arjs="sourceType:webcam; debugUIEnabled:false;" interaction-detector>
    <a-marker preset="hiro">
        <a-entity id="ze" gltf-model="./ZeAlencar.glb" position="0 0 0" rotation="0 0 0" scale="2 2 2"></a-entity>
    </a-marker>

    <a-marker preset="kanji">
        <a-entity id="livro" gltf-model="./livro.glb" position="0 0 0" rotation="0 0 0" scale="2 2 2"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="1"></a-light>
</a-scene>

<script>
// ------------------------------------------------------------
// Lógica de interação por toque para movimentar, girar e
// ampliar os modelos 3D na cena AR.
// ------------------------------------------------------------
const ze = document.querySelector('#ze');
const livro = document.querySelector('#livro');
const sceneEl = document.querySelector('a-scene');
const cameraEl = document.querySelector('a-entity[camera]');

const raycaster = new THREE.Raycaster();
const touchNDC = new THREE.Vector2();

let activeModel = null;
const gestureState = {
    singleX: 0,
    singleY: 0,
    centerX: 0,
    centerY: 0,
    distance: 0,
    angle: 0
};

window.ARTouchState = window.ARTouchState || {
    isInteracting: false,
    target: null
};

// Funções auxiliares para calcular gesto com 1 ou 2 dedos.
function getDistance(t1, t2) {
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function getCenter(t1, t2) {
    return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2
    };
}

function getAngle(t1, t2) {
    return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);
}

function normalizeAngleDelta(delta) {
    if (delta > Math.PI) return delta - (Math.PI * 2);
    if (delta < -Math.PI) return delta + (Math.PI * 2);
    return delta;
}

function setTouchState(model, isInteracting) {
    window.ARTouchState.isInteracting = isInteracting;
    window.ARTouchState.target = isInteracting && model ? model.getAttribute('id') : null;
}

function isAudioControlEventTarget(event) {
    return !!(event.target && event.target.closest && event.target.closest('#audioBtn'));
}

function getTouchedModel(x, y) {
    if (!sceneEl || !cameraEl || !sceneEl.canvas) {
        return null;
    }

    const camera = cameraEl.getObject3D('camera');
    if (!camera) {
        return null;
    }

    const canvasRect = sceneEl.canvas.getBoundingClientRect();
    if (canvasRect.width === 0 || canvasRect.height === 0) {
        return null;
    }

    touchNDC.x = ((x - canvasRect.left) / canvasRect.width) * 2 - 1;
    touchNDC.y = -(((y - canvasRect.top) / canvasRect.height) * 2 - 1);

    raycaster.setFromCamera(touchNDC, camera);

    const visibleTargets = [];
    if (ze.object3D.visible) visibleTargets.push(ze.object3D);
    if (livro.object3D.visible) visibleTargets.push(livro.object3D);

    if (visibleTargets.length === 0) {
        return null;
    }

    const intersections = raycaster.intersectObjects(visibleTargets, true);
    if (intersections.length === 0) {
        return null;
    }

    let node = intersections[0].object;
    while (node) {
        if (node === ze.object3D) return ze;
        if (node === livro.object3D) return livro;
        node = node.parent;
    }

    return null;
}

function pickModelFromTouches(touches) {
    if (!touches || touches.length === 0) {
        return null;
    }

    if (touches.length >= 2) {
        const center = getCenter(touches[0], touches[1]);
        return getTouchedModel(center.x, center.y) ||
            getTouchedModel(touches[0].clientX, touches[0].clientY) ||
            getTouchedModel(touches[1].clientX, touches[1].clientY);
    }

    return getTouchedModel(touches[0].clientX, touches[0].clientY);
}

function syncGestureFromTouches(touches) {
    if (!touches || touches.length === 0) {
        return;
    }

    if (touches.length === 1) {
        gestureState.singleX = touches[0].clientX;
        gestureState.singleY = touches[0].clientY;
        return;
    }

    const t1 = touches[0];
    const t2 = touches[1];
    const center = getCenter(t1, t2);

    gestureState.centerX = center.x;
    gestureState.centerY = center.y;
    gestureState.distance = getDistance(t1, t2);
    gestureState.angle = getAngle(t1, t2);
}

function applySingleFingerGesture(touch, model) {
    const currentX = touch.clientX;
    const currentY = touch.clientY;
    const deltaX = currentX - gestureState.singleX;
    const deltaY = currentY - gestureState.singleY;
    const rot = model.getAttribute('rotation');

    model.setAttribute('rotation', {
        x: rot.x - deltaY * 0.35,
        y: rot.y + deltaX * 0.35,
        z: rot.z
    });

    gestureState.singleX = currentX;
    gestureState.singleY = currentY;
}

function applyTwoFingerGesture(t1, t2, model) {
    const center = getCenter(t1, t2);
    const distance = getDistance(t1, t2);
    const angle = getAngle(t1, t2);

    const deltaCenterX = (center.x - gestureState.centerX) * 0.0022;
    const deltaCenterY = (center.y - gestureState.centerY) * 0.0022;
    const deltaAngle = normalizeAngleDelta(angle - gestureState.angle);

    const pos = model.getAttribute('position');
    const rot = model.getAttribute('rotation');
    const scale = model.getAttribute('scale');

    let scaleFactor = 1;
    if (gestureState.distance > 0) {
        scaleFactor = distance / gestureState.distance;
    }

    let newScale = scale.x * scaleFactor;
    newScale = Math.max(0.5, Math.min(newScale, 8));

    model.setAttribute('position', {
        x: pos.x + deltaCenterX,
        y: pos.y - deltaCenterY,
        z: pos.z
    });

    model.setAttribute('rotation', {
        x: rot.x,
        y: rot.y,
        z: rot.z + (deltaAngle * 180 / Math.PI)
    });

    model.setAttribute('scale', {
        x: newScale,
        y: newScale,
        z: newScale
    });

    gestureState.centerX = center.x;
    gestureState.centerY = center.y;
    gestureState.distance = distance;
    gestureState.angle = angle;
}

// Início do toque na tela: identifica qual modelo foi tocado.
function handleTouchStart(e) {
    if (isAudioControlEventTarget(e)) return;

    activeModel = pickModelFromTouches(e.touches);
    if (!activeModel) return;

    setTouchState(activeModel, true);
    syncGestureFromTouches(e.touches);
}

// Movimento do dedo: aplica rotação, translação e zoom no modelo selecionado.
function handleTouchMove(e) {
    if (isAudioControlEventTarget(e)) return;

    e.preventDefault();

    if (!activeModel && e.touches.length > 0) {
        activeModel = pickModelFromTouches(e.touches);
    }

    if (!activeModel) {
        setTouchState(null, false);
        return;
    }

    setTouchState(activeModel, true);

    if (e.touches.length === 1) {
        applySingleFingerGesture(e.touches[0], activeModel);
    }

    if (e.touches.length >= 2) {
        applyTwoFingerGesture(e.touches[0], e.touches[1], activeModel);
    }
}

// Fim do toque: libera o modelo e encerra o estado de interação.
function handleTouchEnd(e) {
    if (isAudioControlEventTarget(e)) return;

    if (e.touches.length === 0) {
        setTouchState(null, false);
        activeModel = null;
        return;
    }

    syncGestureFromTouches(e.touches);
}

document.addEventListener('touchstart', handleTouchStart, { passive: false });
document.addEventListener('touchmove', handleTouchMove, { passive: false });
document.addEventListener('touchend', handleTouchEnd, { passive: false });
document.addEventListener('touchcancel', () => {
    setTouchState(null, false);
    activeModel = null;
}, { passive: false });

ze.addEventListener('model-loaded', () => {
    console.log('ZeAlencar carregado');
});

livro.addEventListener('model-loaded', () => {
    console.log('Livro carregado');
});

ze.addEventListener('model-error', (e) => {
    console.error('Erro ZeAlencar', e);
});

livro.addEventListener('model-error', (e) => {
    console.error('Erro Livro', e);
});
</script>
</body>
</html>
