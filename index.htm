<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <title>AR - Projeto Final</title>
 <!-- A-Frame + AR.js -->
 <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
 <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
   body {margin: 0; overflow: hidden}
 </style>
</head>
<body>
 <a-scene embedded arjs="sourceType: webcam;">
   <a-entity camera></a-entity>

   <!-- marcador hiro com ZeAlencar.glb -->
   <a-marker preset="hiro" size="0.11">
     <a-entity id="s1" gltf-model="ZeAlencar.glb"
               scale="1.2 1.2 1.2"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- marcador kanji com livro.glb -->
   <a-marker preset="kanji" size="0.11">
     <a-entity id="s2" gltf-model="livro.glb"
               scale="1.2 1.2 1.2"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- luzes -->
   <a-light type="ambient" color="#CCC"></a-light>
   <a-light type="directional" intensity="0.9" position="1 1 0"></a-light>
 </a-scene>

 <!-- Componente para zoom e rotação com toque -->
 <script>
   AFRAME.registerComponent('gesture-handler', {
     schema: {enabled: {default: true}},
     init: function () {
       const el = this.el;
       let scaleFactor = 1.2;   // escala inicial
       let rotationY = 0;
       const minScale = 0.5;    // limite mínimo
       const maxScale = 3.0;    // limite máximo

       // Zoom com gesto de pinça
       el.sceneEl.addEventListener('touchmove', function (evt) {
         if (evt.touches.length === 2) {
           const dx = evt.touches[0].clientX - evt.touches[1].clientX;
           const dy = evt.touches[0].clientY - evt.touches[1].clientY;
           const dist = Math.sqrt(dx * dx + dy * dy);
           if (this.lastDist) {
             const delta = dist - this.lastDist;
             scaleFactor += delta * 0.001;
             // aplica limites
             scaleFactor = Math.min(Math.max(scaleFactor, minScale), maxScale);
             el.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
           }
           this.lastDist = dist;
         }
       });

       // Rotação com arrasto de um dedo
       el.sceneEl.addEventListener('touchmove', function (evt) {
         if (evt.touches.length === 1) {
           rotationY += evt.touches[0].movementX * 0.5;
           el.setAttribute('rotation', `0 ${rotationY} 0`);
         }
       });
     }
   });
 </script>
</body>
</html>
