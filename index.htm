<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <title>AR - Projeto Final</title>
 <!-- A-Frame + AR.js -->
 <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
 <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
   body {margin: 0; overflow: hidden}
 </style>
</head>
<body>
 <a-scene embedded arjs="sourceType: webcam;">
   <a-entity camera></a-entity>

   <!-- marcador hiro com ZeAlencar.glb -->
   <a-marker preset="hiro" size="0.11">
     <a-entity id="s1" gltf-model="ZeAlencar.glb"
               scale="3 3 3"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- marcador kanji com livro.glb -->
   <a-marker preset="kanji" size="0.11">
     <a-entity id="s2" gltf-model="livro.glb"
               scale="3 3 3"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- luzes -->
   <a-light type="ambient" color="#CCC"></a-light>
   <a-light type="directional" intensity="0.9" position="1 1 0"></a-light>
 </a-scene>

 <!-- Componente para zoom e rotação com toque -->
 <script>
   AFRAME.registerComponent('gesture-handler', {
     schema: {enabled: {default: true}},
     init: function () {
       const el = this.el;
       const sceneEl = el.sceneEl;
       let scaleFactor = Number(el.getAttribute('scale').x) || 1;
       let rotationY = Number(el.getAttribute('rotation').y) || 0;
      let lastDistance = null;
      let lastAngle = null;
      let lastTouchX = null;
       const minScale = 0.5;
       const maxScale = 6.0;

       const getMarkerEl = () => el.closest('a-marker');

       const isActive = () => {
         const markerEl = getMarkerEl();
         return this.data.enabled && (!markerEl || markerEl.object3D.visible);
       };

       const getDistance = (touchA, touchB) => {
         const dx = touchA.clientX - touchB.clientX;
         const dy = touchA.clientY - touchB.clientY;
         return Math.hypot(dx, dy);
       };

       const getAngle = (touchA, touchB) => {
         return Math.atan2(touchB.clientY - touchA.clientY, touchB.clientX - touchA.clientX);
       };

       const resetGesture = () => {
         lastDistance = null;
         lastAngle = null;
         lastTouchX = null;
       };

       sceneEl.addEventListener('touchstart', (evt) => {
         if (!isActive()) {
           return;
         }

         if (evt.touches.length === 1) {
           lastTouchX = evt.touches[0].clientX;
           lastDistance = null;
           lastAngle = null;
         }

         if (evt.touches.length === 2) {
           lastDistance = getDistance(evt.touches[0], evt.touches[1]);
           lastAngle = getAngle(evt.touches[0], evt.touches[1]);
           lastTouchX = null;
         }
       }, {passive: false});

       sceneEl.addEventListener('touchmove', (evt) => {
         if (!isActive()) {
           return;
         }

         if (evt.touches.length === 1) {
           evt.preventDefault();
           const touchX = evt.touches[0].clientX;
           const deltaX = touchX - lastTouchX;

           if (lastTouchX !== null) {
             rotationY += deltaX * 0.5;
             el.setAttribute('rotation', `0 ${rotationY} 0`);
           }

           lastTouchX = touchX;
           return;
         }

         if (evt.touches.length === 2) {
           evt.preventDefault();
           const currentDistance = getDistance(evt.touches[0], evt.touches[1]);
           const currentAngle = getAngle(evt.touches[0], evt.touches[1]);

           if (lastDistance !== null && lastDistance > 0) {
             scaleFactor *= currentDistance / lastDistance;
             scaleFactor = Math.min(Math.max(scaleFactor, minScale), maxScale);
             el.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
           }

           if (lastAngle !== null) {
             rotationY += (currentAngle - lastAngle) * (180 / Math.PI);
             el.setAttribute('rotation', `0 ${rotationY} 0`);
           }

           lastDistance = currentDistance;
           lastAngle = currentAngle;
         }
       }, {passive: false});

       sceneEl.addEventListener('touchend', resetGesture);
       sceneEl.addEventListener('touchcancel', resetGesture);
     }
   });
 </script>
</body>
</html>
