<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR - Projeto Final</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- arjs-gestures: biblioteca dedicada para pinch e drag no AR.js -->
  <script src="https://raw.githack.com/fcor/arjs-gestures/main/dist/gestures.js"></script>

  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
    }
    a-scene, canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- gesture-detector DEVE estar em a-scene para a biblioteca funcionar -->
  <a-scene embedded arjs="sourceType: webcam;" gesture-detector>
    <a-entity camera></a-entity>

    <!-- marcador hiro com ZeAlencar.glb -->
    <a-marker preset="hiro" size="0.11">
      <a-entity id="s1"
                gltf-model="ZeAlencar.glb"
                scale="3 3 3"
                position="0 0 0"
                rotation="0 0 0"
                gesture-handler="minScale: 0.5; maxScale: 6; rotationFactor: 5;">
      </a-entity>
    </a-marker>

    <!-- marcador kanji com livro.glb -->
    <a-marker preset="kanji" size="0.11">
      <a-entity id="s2"
                gltf-model="livro.glb"
                scale="3 3 3"
                position="0 0 0"
                rotation="0 0 0"
                gesture-handler="minScale: 0.5; maxScale: 6; rotationFactor: 5;">
      </a-entity>
    </a-marker>

    <!-- luzes -->
    <a-light type="ambient" color="#CCC"></a-light>
    <a-light type="directional" intensity="0.9" position="1 1 0"></a-light>
  </a-scene>
</body>
</html>
