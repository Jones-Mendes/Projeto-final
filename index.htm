<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Projeto Final AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
html,
body{
    margin:0;
    padding:0;
    overflow:hidden;
    touch-action:none;
    width:100%;
    height:100%;
}

canvas{
    touch-action:none;
}
</style>

</head>

<body>

<a-scene
embedded
vr-mode-ui="enabled:false"
renderer="logarithmicDepthBuffer:true;"
arjs="sourceType:webcam; debugUIEnabled:false;">

<a-marker preset="hiro">

<a-entity
id="ze"
gltf-model="./ZeAlencar.glb"
position="0 0 0"
rotation="0 0 0"
scale="2 2 2"> </a-entity>

</a-marker>

<a-marker preset="kanji">

<a-entity
id="livro"
gltf-model="./livro.glb"
position="0 0 0"
rotation="0 0 0"
scale="2 2 2"> </a-entity>

</a-marker>

<a-entity camera></a-entity>

<a-light
type="ambient"
intensity="1.2"> </a-light>

<a-light
type="directional"
position="1 2 1"
intensity="1"> </a-light>

</a-scene>

<script>

const ze = document.querySelector("#ze");
const livro = document.querySelector("#livro");

let activeModel = null;

let startDistance = 0;
let currentScale = 2;

let lastX = 0;
let lastY = 0;

let rotationY = 0;

function getDistance(t1, t2){

const dx = t2.clientX - t1.clientX;
const dy = t2.clientY - t1.clientY;

return Math.sqrt(dx * dx + dy * dy);
}

function getVisibleModel(){

const hiroMarker =
document.querySelectorAll("a-marker")[0];

const kanjiMarker =
document.querySelectorAll("a-marker")[1];

if(hiroMarker.object3D.visible){
return ze;
}

if(kanjiMarker.object3D.visible){
return livro;
}

return null;
}

document.addEventListener("touchstart",(e)=>{

activeModel = getVisibleModel();

if(!activeModel) return;

if(e.touches.length === 1){

lastX = e.touches[0].clientX;

}

if(e.touches.length === 2){

startDistance = getDistance(
e.touches[0],
e.touches[1]
);

lastX =
(e.touches[0].clientX +
e.touches[1].clientX)/2;

lastY =
(e.touches[0].clientY +
e.touches[1].clientY)/2;

}

},{passive:false});

document.addEventListener("touchmove",(e)=>{

e.preventDefault();

activeModel = getVisibleModel();

if(!activeModel) return;

if(e.touches.length === 1){

const currentX =
e.touches[0].clientX;

const deltaX =
currentX - lastX;

rotationY += deltaX * 0.4;

activeModel.setAttribute(
"rotation",
{
x:0,
y:rotationY,
z:0
}
);

lastX = currentX;
}

if(e.touches.length === 2){

const currentDistance =
getDistance(
e.touches[0],
e.touches[1]
);

let scaleFactor =
currentDistance /
startDistance;

let newScale =
currentScale *
scaleFactor;

newScale =
Math.max(
0.5,
Math.min(
newScale,
8
)
);

activeModel.setAttribute(
"scale",
{
x:newScale,
y:newScale,
z:newScale
}
);

const centerX =
(e.touches[0].clientX +
e.touches[1].clientX)/2;

const centerY =
(e.touches[0].clientY +
e.touches[1].clientY)/2;

const dx =
(centerX - lastX) * 0.002;

const dy =
(centerY - lastY) * 0.002;

const pos =
activeModel.getAttribute("position");

activeModel.setAttribute(
"position",
{
x: pos.x + dx,
y: pos.y - dy,
z: pos.z
}
);

lastX = centerX;
lastY = centerY;
}

},{passive:false});

document.addEventListener("touchend",()=>{

if(!activeModel) return;

const scale =
activeModel.getAttribute("scale");

currentScale = scale.x;

});

ze.addEventListener("model-loaded",()=>{
console.log("ZeAlencar carregado");
});

livro.addEventListener("model-loaded",()=>{
console.log("Livro carregado");
});

ze.addEventListener("model-error",(e)=>{
console.error("Erro ZeAlencar",e);
});

livro.addEventListener("model-error",(e)=>{
console.error("Erro Livro",e);
});

</script>

</body>
</html>
