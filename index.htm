<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
 <title>AR - Projeto Final</title>
 <!-- A-Frame + AR.js -->
 <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
 <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
 <style>
   html, body {
     margin: 0;
     overflow: hidden;
     touch-action: none;
   }

   a-scene,
   canvas {
     touch-action: none;
   }
 </style>
</head>
<body>
 <a-scene embedded arjs="sourceType: webcam;">
   <a-entity camera></a-entity>

   <!-- marcador hiro com ZeAlencar.glb -->
   <a-marker preset="hiro" size="0.11">
     <a-entity id="s1" gltf-model="ZeAlencar.glb"
               scale="3 3 3"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- marcador kanji com livro.glb -->
   <a-marker preset="kanji" size="0.11">
     <a-entity id="s2" gltf-model="livro.glb"
               scale="3 3 3"
               position="0 0 0"
               gesture-handler></a-entity>
   </a-marker>

   <!-- luzes -->
   <a-light type="ambient" color="#CCC"></a-light>
   <a-light type="directional" intensity="0.9" position="1 1 0"></a-light>
 </a-scene>

 <!-- Componente para zoom e rotação com toque -->
 <script>
   AFRAME.registerComponent('gesture-handler', {
     init: function () {
       const el = this.el;
       const sceneEl = el.sceneEl;
       let scaleFactor = 3;   // escala inicial
       let rotation = {x: 0, y: 0, z: 0};
       let lastTouch = null;
       let lastDistance = null;
       const minScale = 0.5;
       const maxScale = 6.0;
       let gestureTarget = null;

       const markerEl = el.closest('a-marker');

       const isMarkerVisible = () => {
         return !markerEl || markerEl.object3D.visible;
       };

       // Função auxiliar para distância entre dois dedos
       const getDistance = (touchA, touchB) => {
         const dx = touchA.clientX - touchB.clientX;
         const dy = touchA.clientY - touchB.clientY;
         return Math.hypot(dx, dy);
       };

       const onTouchStart = (evt) => {
         if (!isMarkerVisible()) {
           return;
         }

         if (evt.touches.length === 1) {
           lastTouch = {x: evt.touches[0].clientX, y: evt.touches[0].clientY};
           lastDistance = null;
         }

         if (evt.touches.length === 2) {
           lastDistance = getDistance(evt.touches[0], evt.touches[1]);
           lastTouch = null;
         }
       };

       const onTouchMove = (evt) => {
         if (!isMarkerVisible()) {
           return;
         }

         if (evt.touches.length === 1 && lastTouch) {
           evt.preventDefault();
           const dx = evt.touches[0].clientX - lastTouch.x;
           const dy = evt.touches[0].clientY - lastTouch.y;
           rotation.y += dx * 0.5;   // rotação horizontal
           rotation.x -= dy * 0.5;   // rotação vertical
           el.setAttribute('rotation', `${rotation.x} ${rotation.y} ${rotation.z}`);
           lastTouch = {x: evt.touches[0].clientX, y: evt.touches[0].clientY};
         }

         if (evt.touches.length === 2 && lastDistance !== null) {
           evt.preventDefault();
           const currentDistance = getDistance(evt.touches[0], evt.touches[1]);
           scaleFactor *= currentDistance / lastDistance;
           scaleFactor = Math.min(Math.max(scaleFactor, minScale), maxScale);
           el.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
           lastDistance = currentDistance;
         }
       };

       const resetGesture = () => {
         lastTouch = null;
         lastDistance = null;
       };

       const attachGestureListeners = () => {
         gestureTarget = sceneEl.canvas || sceneEl;
         gestureTarget.style.touchAction = 'none';
         gestureTarget.addEventListener('touchstart', onTouchStart, {passive: false});
         gestureTarget.addEventListener('touchmove', onTouchMove, {passive: false});
         gestureTarget.addEventListener('touchend', resetGesture, {passive: false});
         gestureTarget.addEventListener('touchcancel', resetGesture, {passive: false});
       };

       if (sceneEl.hasLoaded) {
         attachGestureListeners();
       } else {
         sceneEl.addEventListener('loaded', attachGestureListeners, {once: true});
       }

       this.remove = function () {
         if (!gestureTarget) {
           return;
         }

         gestureTarget.removeEventListener('touchstart', onTouchStart);
         gestureTarget.removeEventListener('touchmove', onTouchMove);
         gestureTarget.removeEventListener('touchend', resetGesture);
         gestureTarget.removeEventListener('touchcancel', resetGesture);
       };
     }
   });
 </script>
</body>
</html>
